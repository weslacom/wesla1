:root{--bg:#07111f;--panel:#102238;--line:#27415c;--text:#eef6ff;--muted:#9bb0c7;--cyan:#4dd9df;--blue:#5689ff}*{box-sizing:border-box}body{margin:0;padding-bottom:100px;background:radial-gradient(circle at 80% -10%,#17385a,transparent 35%),var(--bg);color:var(--text);font:16px Tahoma,Arial;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:20px 20px 110px}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{color:var(--cyan);font-size:25px;font-weight:bold}.panel,.card{background:linear-gradient(145deg,#122943,#0d1a2b);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tabs{position:fixed!important;z-index:1000;bottom:12px;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 20px);display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin:0;padding:8px 12px;background:rgba(10,25,43,.72);border:1px solid rgba(110,205,230,.34);border-radius:28px;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);scrollbar-width:none;box-shadow:0 12px 38px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.12)}.tabs::-webkit-scrollbar{display:none}.tabs button,button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(120deg,var(--blue),#13aebd);color:white;font-weight:bold;cursor:pointer}.tabs button{background:rgba(30,55,82,.72);border:1px solid transparent;flex:0 0 auto;min-width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 10px;font-size:11px;white-space:nowrap;border-radius:18px}.tabs button .nav-icon{font-size:19px;line-height:1.1}.tabs button.active{background:linear-gradient(135deg,rgba(86,137,255,.9),rgba(19,174,189,.88));border:1px solid rgba(101,220,228,.78);box-shadow:0 0 18px rgba(72,215,220,.22),inset 0 1px 0 rgba(255,255,255,.22)}.tabs button{min-height:54px}@media(max-width:600px){.wrap{padding:12px 12px 110px}.tabs{bottom:8px;max-width:calc(100vw - 12px);padding:6px 8px;gap:4px}.tabs button{min-width:64px;padding:6px 7px;font-size:10px}}input,textarea,select{width:100%;background:#071525;color:white;border:1px solid #2c4866;border-radius:10px;padding:12px;margin:5px 0 12px;font:inherit}label{color:#c7d9ec;font-size:14px}.muted,.small{color:var(--muted)}.small{font-size:13px}.stat{font-size:28px;color:var(--cyan);font-weight:bold}.item{padding:13px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}.danger{background:#85344b}.good{background:#14766d}.notice{padding:12px;border-radius:10px;background:#123746;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.wrap{padding:12px 12px 110px}.tabs{padding:6px 4px;gap:4px}.tabs button{min-width:66px;padding:6px 7px;font-size:10px}}

</style></head><body><div class="wrap">
<header class="top"><div><div class="brand">وِصلة | مركز الإدارة</div><div class="small">لوحة مستقلة لإدارة المنصة والعقود</div></div><div class="actions"><a id="publicSiteLink" href="#" style="color:var(--cyan)">العودة للموقع</a><button id="changePass" class="hidden" type="button">تغيير كلمة المرور</button><button id="logout" class="hidden">خروج</button></div></header>

</div><script>
const $=s=>document.querySelector(s);const API_BASE_RAW=window.WESLA_API_BASE||'';const API_BASE=API_BASE_RAW.endsWith('/')?API_BASE_RAW.slice(0,-1):API_BASE_RAW;const PUBLIC_SITE_URL=window.WESLA_PUBLIC_URL||'';$('#publicSiteLink').href=PUBLIC_SITE_URL||'#';async function api(url,opts={}){let r;try{r=await fetch(API_BASE+url,{credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},...opts})}catch(e){throw Error('تعذر الوصول إلى بوابة الإدارة أو خادم وصلة. استخدم اختبار اتصال الخادم لمعرفة الجزء المتوقف.')}let d=await r.json().catch(()=>({detail:'استجابة غير مفهومة من خادم وصلة ('+r.status+')'}));if(!r.ok)throw Error(d.detail||'تعذر تنفيذ الطلب ('+r.status+')');return d}
async function testConnection(){const b=$('#testConnection');b.disabled=true;b.textContent='جارٍ الاختبار...';try{const d=await api('/api/_portal/diagnostics');const missing=Object.entries(d.admin_routes||{}).filter(([,ok])=>!ok).map(([path])=>path);msg(d.ok?'الاتصال وقاعدة البيانات ومسارات الإدارة تعمل.':('الخادم: '+(d.api_reachable?'متاح':'متعذر')+' — قاعدة البيانات: '+d.database_status+' — المسارات الناقصة: '+(missing.join('، ')||'لا توجد معلومات كافية')),!d.ok)}catch(e){msg(e.message,true)}finally{b.disabled=false;b.textContent='اختبار اتصال الخادم'}}$('#testConnection').onclick=testConnection;function msg(t,err=false){$('#message').textContent=t;$('#message').className='notice'+(err?' danger':'');$('#message').classList.remove('hidden')}
let activeSectionLoader=null,lastActivity=Date.now(),adminEvents=null;
function markAdminActivity(){lastActivity=Date.now()}
['pointerdown','keydown','input','change','scroll'].forEach(type=>window.addEventListener(type,markAdminActivity,{passive:true}));
function refreshActiveSection(){
  if(document.hidden||Date.now()-lastActivity<18000||!activeSectionLoader)return;
  if($('#content').querySelector('form, input, textarea, select'))return;
  activeSectionLoader();
}
function startAdminRealtime(){
  if(adminEvents)return;
  adminEvents=new EventSource('/api/admin/events');
  adminEvents.onmessage=event=>{
    try{const change=JSON.parse(event.data);if(['users','applications','products','product_variants','product_images','orders','payouts','contracts','contract_requests','contract_negotiations','contract_termination_requests','notifications','announcements','site_settings'].includes(change.table))refreshActiveSection()}catch(_){ }
  };
  adminEvents.addEventListener('auth_expired',()=>{adminEvents.close();adminEvents=null});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshActiveSection()});
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/admin/password-login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await start(d.user)}catch(x){msg(x.message,true)}};
async function start(user){startAdminRealtime();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#changePass').classList.remove('hidden');$('#welcome').textContent='مرحباً '+user.name+' — صلاحية مدير المنصة';$('#tabs').innerHTML='';[['نظرة عامة',overview,'📊'],['العقود',contracts,'📄'],['هوية التوقيع والختم',contractBrandAssets,'🖋️'],['اتفاقية جديدة',newContract,'✍️'],['طلبات التعاقد',contractRequests,'📝'],['التفاوض',negotiationsAdmin,'🤝'],['الفسخ',terminationRequests,'⚖️'],['المنتجات',adminProducts,'📦'],['التجار',()=>accountsAdmin('merchant'),'🏪'],['العملاء',()=>accountsAdmin('customer'),'🛍️'],['المسوقون',()=>accountsAdmin('affiliate'),'📣'],['كل الحسابات',()=>accountsAdmin('all'),'👥'],['الزوار',visitorAdmin,'👁️'],['صفحات الموقع',pagesAdmin,'📄'],['دعوة الأصدقاء والمكافآت',referralsRewardsAdmin,'🎁'],['الأنظمة الذكية والمتقدمة',advancedFeaturesAdmin,'🧠'],['الانضمام',applications,'📨'],['الطلبات',orders,'🛒'],['السحب',payouts,'💳'],['الإعلانات',announcements,'📣'],['كوبونات الخصم',couponsAdmin,'🎟️'],['الدعم والشكاوى',supportAdmin,'🎧']].forEach(([name,fn,icon])=>{let b=document.createElement('button');b.innerHTML='<span class="nav-icon">'+icon+'</span><span>'+name+'</span>';b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeSectionLoader=fn;fn()};$('#tabs').appendChild(b)});$('#tabs button').click()}
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
$('#changePass').onclick=()=>$('#passwordPanel').classList.toggle('hidden');$('#cancelPass').onclick=()=>$('#passwordPanel').classList.add('hidden');$('#passwordForm').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));await api('/api/admin/change-password',{method:'POST',body:JSON.stringify(d)});e.target.reset();$('#passwordPanel').classList.add('hidden');msg('تم تغيير كلمة المرور بنجاح. استخدم الجديدة في المرة القادمة.')}catch(x){msg(x.message,true)}};
async function overview(){try{let d=await api('/api/admin/overview');$('#content').innerHTML='<div class="row" style="justify-content:space-between"><h2>ملخص المنصة</h2><button class="secondary" onclick="overview()">تحديث البيانات</button></div><div class="grid">'+[['المستخدمون',d.users],['المنتجات المنشورة',d.products],['الطلبات',d.orders],['المبيعات المسلّمة',d.sales+' ج'],['عمولة وصلة المحصلة',d.platform_commission+' ج'],['عمولات المسوقين المستحقة',d.affiliate_commission+' ج'],['الطلبات المسلّمة',d.delivered_orders],['طلبات الانضمام',d.applications],['طلبات السحب',d.payouts]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join('')+'</div><p class="muted">يتم احتساب عمولات وصلة والمسوقين في هذا الملخص بعد تحويل حالة الطلب إلى «تم التسليم».</p>'}catch(e){msg(e.message,true)}}
async function contractBrandAssets(){
 try{
  const d=await api('/api/admin/contract-brand-assets');
  const a=d.assets||{};
  const history=d.history||[];
  const types=a.contract_types||['platform_merchant','platform_affiliate','merchant_affiliate'];
  const labels={platform_merchant:'عقد وصلة مع التاجر',platform_affiliate:'عقد وصلة مع المسوق',merchant_affiliate:'عقد التاجر مع المسوق'};
  const preview=(src,label)=>src?'<div class="item"><b>'+label+'</b><br><img src="'+src+'" alt="'+label+'" style="max-width:240px;max-height:110px;object-fit:contain;background:#fff;border-radius:12px;padding:8px"></div>':'<p class="muted">لم يتم رفع '+label+' بعد.</p>';
  $('#content').innerHTML='<h2>هوية التوقيع والختم</h2><p class="small">تظهر الهوية على العقود الجديدة التي يتم إرسالها للتوقيع. أي عقد تم إرساله أو اعتماده يحتفظ بنسخته القديمة دون تغيير.</p>'+preview(a.signature_data_url,'توقيع وصلة')+preview(a.stamp_data_url,'ختم وصلة')+(d.is_primary_admin?'<form id="brandAssetsForm"><h3>تحديث الهوية</h3><label>صورة توقيع الإدارة — PNG بخلفية شفافة</label><input name="signature" type="file" accept="image/png"><label><input type="checkbox" name="clear_signature" style="width:auto"> حذف التوقيع المحفوظ</label><label>ختم وصلة — PNG بخلفية شفافة</label><input name="stamp" type="file" accept="image/png"><label><input type="checkbox" name="clear_stamp" style="width:auto"> حذف الختم المحفوظ</label><label><input type="checkbox" name="active" style="width:auto" '+(a.is_active===false?'':'checked')+'> تفعيل الهوية للعقود الجديدة</label><label><input type="checkbox" name="signature_enabled" style="width:auto" '+(a.signature_enabled===false?'':'checked')+'> إظهار توقيع وصلة</label><label><input type="checkbox" name="stamp_enabled" style="width:auto" '+(a.stamp_enabled===false?'':'checked')+'> إظهار ختم وصلة</label><h3>العقود التي تستخدم الهوية</h3>'+Object.entries(labels).map(([k,v])=>'<label><input type="checkbox" name="contract_types" value="'+k+'" style="width:auto" '+(types.includes(k)?'checked':'')+'> '+v+'</label>').join('')+'<button type="submit">اعتماد التوقيع والختم</button></form>':'<div class="notice">المعاينة متاحة للموظفين، لكن زر «اعتماد التوقيع والختم» لا يظهر إلا للمدير الرئيسي.</div>')+'<h3>سجل الإصدارات السابقة</h3>'+(history.map(x=>'<div class="item">الإصدار '+x.version+' — '+(x.is_active?'مفعّل':'متوقف')+' — '+esc(x.changed_by||'مدير النظام')+' — '+esc(x.created_at||'')+'</div>').join('')||'<p class="muted">لا توجد إصدارات سابقة.</p>');
  if(d.is_primary_admin){
   $('#brandAssetsForm').onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(e.target);
    const readFile=file=>new Promise((resolve,reject)=>{if(!file||!file.size)return resolve(null);const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));reader.readAsDataURL(file)});
    try{
     const signature=await readFile(f.get('signature'));
     const stamp=await readFile(f.get('stamp'));
     const selected=[...e.target.querySelectorAll('input[name="contract_types"]:checked')].map(x=>x.value);
     const payload={signature_data_url:f.get('clear_signature')==='on'?null:(signature||a.signature_data_url||null),stamp_data_url:f.get('clear_stamp')==='on'?null:(stamp||a.stamp_data_url||null),is_active:f.get('active')==='on',signature_enabled:f.get('signature_enabled')==='on',stamp_enabled:f.get('stamp_enabled')==='on',contract_types:selected};
     const result=await api('/api/admin/contract-brand-assets',{method:'PUT',body:JSON.stringify(payload)});
     msg(result.message);contractBrandAssets();
    }catch(x){msg(x.message,true)}
   };
  }
 }catch(e){msg(e.message,true)}
}
async function contracts(){try{let a=await api('/api/admin/contracts');$('#content').innerHTML='<h2>العقود والاتفاقيات</h2>'+ (a.map(c=>'<div class="item"><b>'+esc(c.contract_number||('#'+c.id))+' — '+esc(c.title)+'</b><p class="small">'+typeName(c.contract_type)+' | الحالة: '+c.status+' | الإصدار '+c.version+' | العمولة: '+(c.commission_rate??'حسب الاتفاق')+'%</p><p>'+esc(c.body).slice(0,260)+'</p><p class="small">التاجر: '+esc(c.merchant_name||'—')+' | المسوق: '+esc(c.affiliate_name||'—')+'</p><p class="small">الموافقات: '+c.acceptances.length+' | سجل الأحداث: '+c.events.length+'</p><div class="actions">'+(c.status==='draft'&&!!c.contract_number?'<button onclick="act('+c.id+',\'activate\')">إرسال للتوقيع</button>':'')+(needsPlatformApproval(c)?'<button class="good" onclick="approveContract('+c.id+')">اعتماد الإدارة وإتمام الاتفاقية</button>':'')+(needsLegacyPlatformReopen(c)?'<button class="danger" onclick="reopenLegacyPlatformContract('+c.id+')">إعادة فتح الاعتماد الناقص</button>':'')+(needsNumberedReissue(c)?'<button class="secondary" onclick="reissueNumberedContract('+c.id+')">إعادة إصدار برقم رسمي</button>':'')+(['signed','termination_review','terminated'].includes(c.status)?'<button onclick="window.open(\'/api/contracts/'+c.id+'/document\',\'_blank\')">فتح النسخة النهائية / طباعة PDF</button>':'')+(c.status==='termination_review'?'<span>طلب فسخ قيد المراجعة</span>':'')+(c.status!=='archived'&&c.status!=='signed'?'<button class="danger" onclick="act('+c.id+',\'archive\')">أرشفة</button>':'')+'</div></div>').join('')||'<p class="muted">لا توجد اتفاقيات بعد.</p>') }catch(e){msg(e.message,true)}}
function typeName(t){return {platform_merchant:'المنصة مع التاجر',platform_affiliate:'المنصة مع المسوق',merchant_affiliate:'التاجر مع المسوق'}[t]||t}function needsNumberedReissue(c){return !c.contract_number&&['draft','active'].includes(c.status)}async function reissueNumberedContract(id){if(!confirm('سيتم إنشاء نسخة جديدة برقم رسمي، وأرشفة النسخة القديمة مع الاحتفاظ بسجلها. على الأطراف إعادة الموافقة على النسخة الجديدة. متابعة؟'))return;try{const d=await api('/api/admin/contracts/'+id+'/reissue-numbered',{method:'POST'});contracts();msg(d.message)}catch(e){msg(e.message,true)}}function needsLegacyPlatformReopen(c){return c.status==='signed'&&c.contract_type.startsWith('platform_')&&!c.acceptances.some(a=>a.role==='admin')}async function reopenLegacyPlatformContract(id){if(!confirm('هذه الاتفاقية سُجلت سابقًا كموقعة دون موافقة مستقلة من ممثل الإدارة. ستُعاد إلى انتظار الاعتماد مع الاحتفاظ بالبصمة التاريخية. متابعة؟'))return;try{await api('/api/admin/contracts/'+id+'/reopen-for-platform-approval',{method:'POST'});contracts();msg('أعيدت الاتفاقية إلى انتظار اعتماد الإدارة')}catch(e){msg(e.message,true)}}function needsPlatformApproval(c){const ids=c.contract_type==='platform_merchant'?[c.merchant_id]:c.contract_type==='platform_affiliate'?[c.affiliate_id]:[];return !!c.contract_number&&c.status==='active'&&ids.length===1&&ids.every(id=>c.acceptances.some(a=>a.user_id===id))&&!c.acceptances.some(a=>a.role==='admin')}async function approveContract(id){if(!confirm('تأكيد موافقة ممثل الإدارة على هذه النسخة كما هي؟'))return;try{await api('/api/admin/contracts/'+id+'/approve',{method:'POST',body:JSON.stringify({accepted:true})});contracts();msg('تم تسجيل اعتماد الإدارة وإتمام الاتفاقية')}catch(e){msg(e.message,true)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderSitePage(x){return '<div class="item"><b>'+esc(x.title)+'</b><p class="small">/'+ 'page/'+esc(x.slug)+' — '+(x.is_published?'منشورة':'مسودة')+' — الجمهور: '+esc(x.audience)+'</p><div class="actions"><button class="secondary" onclick="editSitePage('+x.id+')">تعديل</button><a href="/page/'+encodeURIComponent(x.slug)+'" target="_blank" rel="noopener">معاينة</a><button class="danger" onclick="deleteSitePage('+x.id+')">حذف</button></div><div class="hidden" id="site-page-data-'+x.id+'" data-page="'+esc(JSON.stringify(x))+'"></div></div>'}
function editSitePage(id){const el=$('#site-page-data-'+id);if(!el)return;const x=JSON.parse(el.dataset.page),f=$('#sitePageForm');f.elements.id.value=x.id;f.elements.title.value=x.title;f.elements.slug.value=x.slug;f.elements.body.value=x.body;f.elements.audience.value=x.audience;f.elements.is_published.checked=x.is_published;f.scrollIntoView({behavior:'smooth'})}
function resetSitePageForm(){const f=$('#sitePageForm');f.reset();f.elements.id.value=''}
async function deleteSitePage(id){if(!confirm('حذف الصفحة نهائياً؟'))return;try{await api('/api/admin/pages/'+id,{method:'DELETE'});pagesAdmin();msg('تم حذف الصفحة')}catch(e){msg(e.message,true)}}
async function referralsRewardsAdmin(){
 try{
  const [cfg,refs,offers]=await Promise.all([api('/api/admin/referral-rewards/config'),api('/api/admin/referrals'),api('/api/admin/rewards/offers')]);
  $('#content').innerHTML='<h2>دعوة الأصدقاء وبرنامج المكافآت</h2><p class="small">تُراجع الإحالات قبل صرف النقاط، وتُمنح نقاط الشراء للحسابات المسجلة فقط بعد تسليم الطلب. يمكن استبدال النقاط بكوبونات خصم من المتجر.</p><form id="referralConfigForm"><label>نقاط مكافأة الإحالة المعتمدة</label><input name="referral_reward_points" type="number" min="0" max="100000" value="'+cfg.referral_reward_points+'" required><label>نقاط لكل 100 جنيه من طلب تم تسليمه</label><input name="purchase_points_per_100_egp" type="number" min="0" max="10000" value="'+cfg.purchase_points_per_100_egp+'" required><button>حفظ إعدادات النقاط</button></form><h3>إنشاء مكافأة قابلة للاستبدال</h3><form id="rewardOfferForm"><label>اسم المكافأة</label><input name="title" required minlength="2" maxlength="180"><label>الوصف</label><textarea name="description" rows="2" maxlength="3000"></textarea><div class="grid"><div><label>تكلفة النقاط</label><input name="points_cost" type="number" min="1" required></div><div><label>نوع الخصم</label><select name="discount_type"><option value="fixed">مبلغ ثابت</option><option value="percent">نسبة مئوية</option></select></div><div><label>قيمة الخصم</label><input name="discount_value" type="number" min=".01" step=".01" required></div><div><label>الحد الأدنى للطلب</label><input name="min_order_total" type="number" min="0" step=".01" value="0"></div><div><label>أقصى خصم (اختياري)</label><input name="max_discount" type="number" min=".01" step=".01"></div><div><label>صلاحية الكوبون بالأيام</label><input name="coupon_valid_days" type="number" min="1" max="365" value="30"></div><div><label>عدد مرات الاستخدام</label><input name="usage_limit" type="number" min="1" max="1000" value="1"></div></div><label><input type="checkbox" name="is_active" checked style="width:auto"> تفعيل المكافأة</label><button>إضافة المكافأة</button></form><h3>المكافآت الحالية</h3>'+(offers.map(renderRewardOfferAdmin).join('')||'<p class="muted">لم تتم إضافة مكافآت بعد.</p>')+'<h3>دعوات الأصدقاء</h3>'+(refs.map(r=>'<div class="item"><b>'+esc(r.inviter_name)+' دعا '+esc(r.invited_name)+'</b><p class="small">كود: '+esc(r.referral_code)+' — الحالة: '+esc(r.status)+' — المكافأة: '+r.reward_points+' نقطة</p>'+(r.status==='registered'?'<button onclick="qualifyReferral('+r.id+')">اعتماد الإحالة وصرف النقاط</button>':'')+'</div>').join('')||'<p class="muted">لا توجد إحالات مسجلة بعد.</p>')+'<h3>تسوية نقاط يدوية</h3><form id="manualRewardForm"><label>رقم المستخدم</label><input name="user_id" type="number" min="1" required><label>عدد النقاط (موجب للإضافة وسالب للخصم)</label><input name="delta" type="number" min="-1000000" max="1000000" required><label>سبب التسوية</label><input name="description" required minlength="5" maxlength="240"><button>تسجيل التسوية</button></form>';
  $('#referralConfigForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/admin/referral-rewards/config',{method:'PATCH',body:JSON.stringify({referral_reward_points:Number(f.get('referral_reward_points')),purchase_points_per_100_egp:Number(f.get('purchase_points_per_100_egp'))})});msg('تم حفظ إعدادات النقاط');referralsRewardsAdmin()}catch(x){msg(x.message,true)}};
  $('#rewardOfferForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const max=f.get('max_discount');const d={title:f.get('title'),description:f.get('description'),points_cost:Number(f.get('points_cost')),discount_type:f.get('discount_type'),discount_value:Number(f.get('discount_value')),min_order_total:Number(f.get('min_order_total')||0),max_discount:max?Number(max):null,coupon_valid_days:Number(f.get('coupon_valid_days')||30),usage_limit:Number(f.get('usage_limit')||1),is_active:f.get('is_active')==='on'};try{await api('/api/admin/rewards/offers',{method:'POST',body:JSON.stringify(d)});msg('تم إنشاء المكافأة');referralsRewardsAdmin()}catch(x){msg(x.message,true)}};
  $('#manualRewardForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),uid=Number(f.get('user_id')),delta=Number(f.get('delta'));const event_key='manual-'+uid+'-'+Date.now();try{await api('/api/admin/advanced/rewards/adjust',{method:'POST',body:JSON.stringify({user_id:uid,delta,event_key,description:f.get('description')})});msg('تم تسجيل تسوية النقاط');referralsRewardsAdmin()}catch(x){msg(x.message,true)}};
 }catch(e){msg(e.message,true)}
}
function renderRewardOfferAdmin(o){return '<div class="item"><b>'+esc(o.title)+'</b><p>'+esc(o.description||'')+'</p><p class="small">'+o.points_cost+' نقطة — '+(o.discount_type==='percent'?o.discount_value+'%':'جنيه '+o.discount_value)+' — '+(o.is_active?'مفعلة':'متوقفة')+' — صلاحية '+o.coupon_valid_days+' يوم</p>'+(o.is_active?'<button class="danger" onclick="disableRewardOffer('+o.id+')">إيقاف المكافأة</button>':'')+'</div>'}
async function disableRewardOffer(id){if(!confirm('إيقاف هذه المكافأة؟'))return;try{await api('/api/admin/rewards/offers/'+id,{method:'DELETE'});msg('تم إيقاف المكافأة');referralsRewardsAdmin()}catch(e){msg(e.message,true)}}

async function qualifyReferral(id){if(!confirm('اعتماد الإحالة وصرف نقاط المكافأة للمستخدم الداعي؟'))return;try{const d=await api('/api/admin/referrals/'+id+'/qualify',{method:'POST'});msg('تم صرف '+d.points_awarded+' نقطة');referralsRewardsAdmin()}catch(e){msg(e.message,true)}}
</script></body></html>
