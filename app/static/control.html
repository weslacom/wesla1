<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة وِصلة</title>
<style>
:root{--bg:#07111f;--panel:#102238;--line:#27415c;--text:#eef6ff;--muted:#9bb0c7;--cyan:#4dd9df;--blue:#5689ff}*{box-sizing:border-box}body{margin:0;padding-bottom:100px;background:radial-gradient(circle at 80% -10%,#17385a,transparent 35%),var(--bg);color:var(--text);font:16px Tahoma,Arial;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:20px 20px 110px}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{color:var(--cyan);font-size:25px;font-weight:bold}.panel,.card{background:linear-gradient(145deg,#122943,#0d1a2b);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tabs{position:fixed!important;z-index:1000;bottom:12px;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 20px);display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin:0;padding:8px 12px;background:rgba(10,25,43,.72);border:1px solid rgba(110,205,230,.34);border-radius:28px;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);scrollbar-width:none;box-shadow:0 12px 38px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.12)}.tabs::-webkit-scrollbar{display:none}.tabs button,button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(120deg,var(--blue),#13aebd);color:white;font-weight:bold;cursor:pointer}.tabs button{background:rgba(30,55,82,.72);border:1px solid transparent;flex:0 0 auto;min-width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 10px;font-size:11px;white-space:nowrap;border-radius:18px}.tabs button .nav-icon{font-size:19px;line-height:1.1}.tabs button.active{background:linear-gradient(135deg,rgba(86,137,255,.9),rgba(19,174,189,.88));border:1px solid rgba(101,220,228,.78);box-shadow:0 0 18px rgba(72,215,220,.22),inset 0 1px 0 rgba(255,255,255,.22)}.tabs button{min-height:54px}@media(max-width:600px){.wrap{padding:12px 12px 110px}.tabs{bottom:8px;max-width:calc(100vw - 12px);padding:6px 8px;gap:4px}.tabs button{min-width:64px;padding:6px 7px;font-size:10px}}input,textarea,select{width:100%;background:#071525;color:white;border:1px solid #2c4866;border-radius:10px;padding:12px;margin:5px 0 12px;font:inherit}label{color:#c7d9ec;font-size:14px}.muted,.small{color:var(--muted)}.small{font-size:13px}.stat{font-size:28px;color:var(--cyan);font-weight:bold}.item{padding:13px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}.danger{background:#85344b}.good{background:#14766d}.notice{padding:12px;border-radius:10px;background:#123746;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.wrap{padding:12px 12px 110px}.tabs{padding:6px 4px;gap:4px}.tabs button{min-width:66px;padding:6px 7px;font-size:10px}}
</style></head><body><div class="wrap">
<header class="top"><div><div class="brand">وِصلة | مركز الإدارة</div><div class="small">لوحة مستقلة لإدارة المنصة والعقود</div></div><div class="actions"><a id="publicSiteLink" href="#" style="color:var(--cyan)">العودة للموقع</a><button id="changePass" class="hidden" type="button">تغيير كلمة المرور</button><button id="logout" class="hidden">خروج</button></div></header>
<div id="message" class="notice hidden"></div>
<section id="login" class="panel"><h2>دخول الإدارة</h2><p class="muted">اكتب كلمة مرور المدير فقط.</p><form id="loginForm"><label>كلمة مرور الإدارة</label><input name="password" type="password" minlength="10" autocomplete="current-password" required><div class="actions"><button>دخول آمن</button><button type="button" id="testConnection" class="secondary">اختبار اتصال الخادم</button></div></form></section>
<section id="passwordPanel" class="panel hidden"><h3>تغيير كلمة مرور الإدارة</h3><form id="passwordForm"><label>كلمة المرور الحالية</label><input name="current_password" type="password" autocomplete="current-password" required><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input name="new_password" type="password" minlength="10" autocomplete="new-password" required><button>حفظ كلمة المرور الجديدة</button><button type="button" class="danger" id="cancelPass">إلغاء</button></form></section><section id="app" class="hidden"><div id="welcome" class="notice"></div><div class="tabs" id="tabs"></div><div class="panel" id="content">اختر قسمًا من الأعلى.</div></section>
</div><script>
const $=s=>document.querySelector(s);const API_BASE_RAW=window.WESLA_API_BASE||'';const API_BASE=API_BASE_RAW.endsWith('/')?API_BASE_RAW.slice(0,-1):API_BASE_RAW;const PUBLIC_SITE_URL=window.WESLA_PUBLIC_URL||'';$('#publicSiteLink').href=PUBLIC_SITE_URL||'#';async function api(url,opts={}){let r;try{r=await fetch(API_BASE+url,{credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},...opts})}catch(e){throw Error('تعذر الوصول إلى بوابة الإدارة أو خادم وصلة. استخدم اختبار اتصال الخادم لمعرفة الجزء المتوقف.')}let d=await r.json().catch(()=>({detail:'استجابة غير مفهومة من خادم وصلة ('+r.status+')'}));if(!r.ok)throw Error(d.detail||'تعذر تنفيذ الطلب ('+r.status+')');return d}
async function testConnection(){const b=$('#testConnection');b.disabled=true;b.textContent='جارٍ الاختبار...';try{const d=await api('/api/_portal/diagnostics');const missing=Object.entries(d.admin_routes||{}).filter(([,ok])=>!ok).map(([path])=>path);msg(d.ok?'الاتصال وقاعدة البيانات ومسارات الإدارة تعمل.':('الخادم: '+(d.api_reachable?'متاح':'متعذر')+' — قاعدة البيانات: '+d.database_status+' — المسارات الناقصة: '+(missing.join('، ')||'لا توجد معلومات كافية')),!d.ok)}catch(e){msg(e.message,true)}finally{b.disabled=false;b.textContent='اختبار اتصال الخادم'}}$('#testConnection').onclick=testConnection;function msg(t,err=false){$('#message').textContent=t;$('#message').className='notice'+(err?' danger':'');$('#message').classList.remove('hidden')}
let activeSectionLoader=null,lastActivity=Date.now(),adminEvents=null;
function markAdminActivity(){lastActivity=Date.now()}
['pointerdown','keydown','input','change','scroll'].forEach(type=>window.addEventListener(type,markAdminActivity,{passive:true}));
function refreshActiveSection(){
  if(document.hidden||Date.now()-lastActivity<18000||!activeSectionLoader)return;
  if($('#content').querySelector('form, input, textarea, select'))return;
  activeSectionLoader();
}
function startAdminRealtime(){
  if(adminEvents)return;
  adminEvents=new EventSource('/api/admin/events');
  adminEvents.onmessage=event=>{
    try{const change=JSON.parse(event.data);if(['users','applications','products','product_variants','product_images','orders','payouts','contracts','contract_requests','contract_negotiations','contract_termination_requests','notifications','announcements','site_settings'].includes(change.table))refreshActiveSection()}catch(_){ }
  };
  adminEvents.addEventListener('auth_expired',()=>{adminEvents.close();adminEvents=null});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshActiveSection()});
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/admin/password-login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await start(d.user)}catch(x){msg(x.message,true)}};
const FEATURE_NAMES={referrals:'دعوة الأصدقاء',rewards:'النقاط والمكافآت',trends:'المنتجات الرائجة',challenges:'التحديات',achievements:'الإنجازات والشارات',academy:'الأكاديمية',wesla_ai:'مساعد وصلة الذكي',recommendations:'التوصيات الذكية',seasonal_campaigns:'الحملات الموسمية',fraud_detection:'كشف الاحتيال',admin_activity_log:'سجل نشاط الإدارة',smart_marketer_matching:'مطابقة المسوقين',inventory_order_alerts:'تنبيهات المخزون والطلبات',marketer_competitions:'مسابقات المسوقين',verified_reviews:'التقييمات الموثقة',advanced_order_tracking:'تتبع الطلبات المتقدم',premium_subscriptions:'الاشتراكات المدفوعة',ads_center:'مركز الإعلانات',marketing_library:'مكتبة المواد التسويقية',wallet_ledger:'المحفظة المالية',disputes_center:'النزاعات والوساطة',bulk_product_import:'استيراد المنتجات الجماعي',price_drop_alerts:'تنبيهات انخفاض الأسعار',bundles_deals:'الباقات والعروض'};
async function advancedSystems(){
 const host=$('#content');host.innerHTML='<h2>الأنظمة الجديدة واعتماد النشر</h2><p class="muted">لن يظهر أي نظام للمستخدمين قبل جاهزيته واعتمادك. الأنظمة قيد التطوير لا يمكن تشغيلها من هذه الصفحة.</p><div class="notice">اعتمادك ينشر النظام للفئات المحددة فقط. أوقف الاعتماد لإخفائه فورًا.</div><div id="featureList">جارٍ تحميل حالة الأنظمة...</div>';
 try{
  const rows=await api('/api/admin/advanced/settings');
  $('#featureList').innerHTML=rows.map(x=>{
   const ready=!!x.is_ready,enabled=!!x.is_enabled;
   const audiences=['customer','merchant','affiliate','visitor','admin'];
   const selected=Array.isArray(x.audience)?x.audience:[];
   const label=FEATURE_NAMES[x.feature_key]||x.feature_key;
   const status=enabled?'معتمد ومنشور':ready?'جاهز لاعتمادك':'قيد التنفيذ — غير قابل للنشر';
   return '<article class="card"><div class="row"><h3>'+label+'</h3><b class="'+(enabled?'good':'')+'">'+status+'</b></div><p class="small">المعرّف: '+x.feature_key+' — '+(ready?'تم فتح اعتماد النشر':'لم يكتمل التنفيذ بعد')+'</p><label>الفئات التي سيظهر لها النظام</label><div class="grid">'+audiences.map(a=>'<label><input style="width:auto" type="checkbox" data-aud="'+a+'" '+(selected.includes(a)?'checked':'')+' '+(!ready?'disabled':'')+'> '+({customer:'العملاء',merchant:'التجار',affiliate:'المسوقون',visitor:'الزوار',admin:'الإدارة'}[a])+'</label>').join('')+'</div><div class="actions"><button '+(!ready?'disabled':'')+' data-approve="'+x.feature_key+'">'+(enabled?'إيقاف النشر':'اعتماد ونشر النظام')+'</button></div></article>';
  }).join('');
  host.querySelectorAll('[data-approve]').forEach(btn=>btn.onclick=async()=>{
   const key=btn.dataset.approve,card=btn.closest('.card'),current=rows.find(x=>x.feature_key===key);
   const audience=[...card.querySelectorAll('[data-aud]:checked')].map(el=>el.dataset.aud);
   if(!current.is_enabled&&!audience.length){msg('حدد فئة واحدة على الأقل قبل الاعتماد.',true);return}
   btn.disabled=true;
   try{await api('/api/admin/advanced/settings/'+key,{method:'PATCH',body:JSON.stringify({is_enabled:!current.is_enabled,audience,config:{implementation_status:!current.is_enabled?'active':'ready_for_approval'}})});msg(!current.is_enabled?'تم اعتماد النظام ونشره للفئات المحددة.':'تم إيقاف النظام وإخفاؤه.');advancedSystems()}catch(e){msg(e.message,true);btn.disabled=false}
  });
 }catch(e){$('#featureList').textContent='تعذر تحميل الأنظمة: '+e.message}
}

async function adminDisputes(){try{const rows=await api('/api/admin/advanced/disputes');$('#content').innerHTML='<h2>النزاعات والوساطة</h2>'+(rows.map(x=>'<div class="item"><b>'+esc(x.order_number)+' — '+esc(x.reason)+'</b><p>'+esc(x.details)+'</p><p>الحالة: '+esc(x.status)+'</p><textarea id="res-'+x.id+'" placeholder="قرار الإدارة / ملاحظات التسوية">'+esc(x.resolution||'')+'</textarea><div class="actions"><button onclick="resolveDispute('+x.id+',\'under_review\')">قيد المراجعة</button><button class="good" onclick="resolveDispute('+x.id+',\'resolved_customer\')">إنصاف العميل</button><button class="good" onclick="resolveDispute('+x.id+',\'resolved_merchant\')">إنصاف التاجر</button><button class="danger" onclick="resolveDispute('+x.id+',\'closed\')">إغلاق</button></div></div>').join('')||'<p>لا توجد نزاعات.</p>')}catch(e){msg(e.message,true)}}async function resolveDispute(id,status){try{await api('/api/admin/advanced/disputes/'+id,{method:'PATCH',body:JSON.stringify({status,resolution:$('#res-'+id).value})});adminDisputes()}catch(e){msg(e.message,true)}}
async function adminReviews(){try{const rows=await api('/api/admin/advanced/reviews');$('#content').innerHTML='<h2>مراجعة التقييمات الموثقة</h2>'+(rows.map(x=>'<div class="item"><b>'+esc(x.product_id)+' — '+esc(x.customer)+' — '+x.rating+'/5</b><p>'+esc(x.review)+'</p><p class="small">الطلب: '+esc(x.order_number)+' — '+esc(x.created_at)+'</p><button class="good" onclick="moderateReview('+x.id+',true)">نشر التقييم</button> <button class="danger" onclick="moderateReview('+x.id+',false)">إخفاء</button></div>').join('')||'<p>لا توجد تقييمات للمراجعة.</p>')}catch(e){msg(e.message,true)}}async function moderateReview(id,v){try{await api('/api/admin/advanced/reviews/'+id,{method:'PATCH',body:JSON.stringify({is_published:v})});adminReviews()}catch(e){msg(e.message,true)}}
async function adminAds(){try{const rows=await api('/api/admin/advanced/ads');$('#content').innerHTML='<h2>مركز الإعلانات المدفوعة</h2>'+(rows.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p>ميزانية مقترحة: '+x.budget+' — مرجع الدفع: '+esc(x.payment_reference)+' — إثبات الدفع: '+(x.payment_verified?'مراجع':'غير مراجع')+' — الحالة: '+esc(x.status)+'</p><a target="_blank" href="'+esc(x.destination_url)+'">رابط الإعلان</a><div class="actions"><button class="good" onclick="decideAd('+x.id+',\'approved\',true)">اعتماد</button><button class="danger" onclick="decideAd('+x.id+',\'rejected\')">رفض</button><button class="secondary" onclick="decideAd('+x.id+',\'paused\')">إيقاف</button></div></div>').join('')||'<p>لا توجد إعلانات.</p>')}catch(e){msg(e.message,true)}}async function decideAd(id,status,verified=false){try{await api('/api/admin/advanced/ads/'+id,{method:'PATCH',body:JSON.stringify({status,payment_verified:verified})});adminAds()}catch(e){msg(e.message,true)}}
async function adminMarketing(){try{const rows=await api('/api/admin/advanced/marketing-library');$('#content').innerHTML='<h2>مكتبة المواد التسويقية</h2><form id="assetForm"><label>العنوان</label><input name="title" required><label>النوع</label><select name="asset_type"><option value="copy">نص</option><option value="image">صورة</option><option value="video">فيديو</option><option value="file">ملف</option><option value="link">رابط</option></select><label>الفئة</label><select name="audience"><option>all</option><option>merchant</option><option>affiliate</option><option>customer</option></select><label>الرابط</label><input name="asset_url"><label>المحتوى</label><textarea name="body"></textarea><label><input style="width:auto" type="checkbox" name="is_published" value="true"> نشر</label><button>إضافة مادة</button></form><h3>المواد الحالية</h3>'+rows.map(x=>'<div class="item">'+esc(x.title)+' — '+esc(x.audience)+' — '+(x.is_published?'منشور':'مسودة')+'</div>').join('');$('#assetForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.is_published=e.target.is_published.checked;try{await api('/api/admin/advanced/marketing-library',{method:'POST',body:JSON.stringify(d)});adminMarketing()}catch(x){msg(x.message,true)}}}catch(e){msg(e.message,true)}}
async function adminAcademy(){try{const rows=await api('/api/admin/advanced/academy');$('#content').innerHTML='<h2>إدارة أكاديمية وصلة</h2><form id="academyForm"><label>العنوان</label><input name="title" required><label>النوع</label><select name="content_type"><option value="article">مقال</option><option value="video">فيديو</option><option value="file">ملف</option><option value="lesson">درس</option></select><label>الجمهور</label><select name="audience"><option>all</option><option>customer</option><option>merchant</option><option>affiliate</option></select><label>رابط المادة</label><input name="media_url"><label>المحتوى</label><textarea name="body" required></textarea><label><input style="width:auto" type="checkbox" name="is_published" value="true"> نشر الآن</label><button>إضافة محتوى</button></form><h3>المحتوى الحالي</h3>'+rows.map(x=>'<div class="item">'+esc(x.title)+' — '+esc(x.audience)+' — '+(x.is_published?'منشور':'مسودة')+' <button onclick="publishAcademy('+x.id+','+(!x.is_published)+')">'+(x.is_published?'إخفاء':'نشر')+'</button></div>').join('');$('#academyForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.is_published=e.target.is_published.checked;try{await api('/api/admin/advanced/academy',{method:'POST',body:JSON.stringify(d)});adminAcademy()}catch(x){msg(x.message,true)}}}catch(e){msg(e.message,true)}}async function publishAcademy(id,v){try{await api('/api/admin/advanced/academy/'+id,{method:'PATCH',body:JSON.stringify({is_published:v})});adminAcademy()}catch(e){msg(e.message,true)}}
async function adminCompetitions(){try{const rows=await api('/api/admin/advanced/competitions');$('#content').innerHTML='<h2>مسابقات المسوقين</h2><form id="compForm"><label>اسم المسابقة</label><input name="title" required><label>الوصف</label><textarea name="description"></textarea><label>بداية المسابقة (ISO)</label><input name="starts_at" placeholder="2026-12-01T00:00:00+02:00" required><label>النهاية</label><input name="ends_at" placeholder="2026-12-31T23:59:00+02:00" required><label>الجائزة</label><input name="prize_description"><label><input style="width:auto" type="checkbox" name="is_active" value="true"> تفعيل</label><button>إنشاء المسابقة</button></form><h3>المسابقات</h3>'+rows.map(x=>'<div class="item">'+esc(x.title)+' — المشاركون: '+x.entrants+' — '+(x.is_active?'نشطة':'متوقفة')+'</div>').join('');$('#compForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.is_active=e.target.is_active.checked;try{await api('/api/admin/advanced/competitions',{method:'POST',body:JSON.stringify(d)});adminCompetitions()}catch(x){msg(x.message,true)}}}catch(e){msg(e.message,true)}}
async function adminSeasonal(){try{const rows=await api('/api/admin/advanced/seasonal-campaigns');$('#content').innerHTML='<h2>الحملات الموسمية</h2><form id="seasonForm"><label>اسم الحملة</label><input name="title" required><label>الوصف</label><textarea name="description"></textarea><label>البداية</label><input name="starts_at" required><label>النهاية</label><input name="ends_at" required><label>الخصم %</label><input name="discount_percent" type="number" min="0" max="80" value="0"><label>الجمهور</label><select name="audience"><option>all</option><option>customer</option><option>merchant</option><option>affiliate</option></select><label>معرفات المنتجات مفصولة بفواصل</label><input name="product_ids" placeholder="1,2,3"><label><input style="width:auto" type="checkbox" name="is_active" value="true"> تفعيل</label><button>إنشاء حملة</button></form>'+rows.map(x=>'<div class="item">'+esc(x.title)+' — '+x.discount_percent+'% — '+(x.is_active?'نشطة':'متوقفة')+'</div>').join('');$('#seasonForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.discount_percent=Number(d.discount_percent);d.product_ids=d.product_ids?d.product_ids.split(',').map(x=>Number(x.trim())).filter(Boolean):[];d.is_active=e.target.is_active.checked;try{await api('/api/admin/advanced/seasonal-campaigns',{method:'POST',body:JSON.stringify(d)});adminSeasonal()}catch(x){msg(x.message,true)}}}catch(e){msg(e.message,true)}}

function typeName(t){return {platform_merchant:'المنصة مع التاجر',platform_affiliate:'المنصة مع المسوق',merchant_affiliate:'التاجر مع المسوق'}[t]||t}function needsNumberedReissue(c){return !c.contract_number&&['draft','active'].includes(c.status)}async function reissueNumberedContract(id){if(!confirm('سيتم إنشاء نسخة جديدة برقم رسمي، وأرشفة النسخة القديمة مع الاحتفاظ بسجلها. على الأطراف إعادة الموافقة على النسخة الجديدة. متابعة؟'))return;try{const d=await api('/api/admin/contracts/'+id+'/reissue-numbered',{method:'POST'});contracts();msg(d.message)}catch(e){msg(e.message,true)}}function needsLegacyPlatformReopen(c){return c.status==='signed'&&c.contract_type.startsWith('platform_')&&!c.acceptances.some(a=>a.role==='admin')}async function reopenLegacyPlatformContract(id){if(!confirm('هذه الاتفاقية سُجلت سابقًا كموقعة دون موافقة مستقلة من ممثل الإدارة. ستُعاد إلى انتظار الاعتماد مع الاحتفاظ بالبصمة التاريخية. متابعة؟'))return;try{await api('/api/admin/contracts/'+id+'/reopen-for-platform-approval',{method:'POST'});contracts();msg('أعيدت الاتفاقية إلى انتظار اعتماد الإدارة')}catch(e){msg(e.message,true)}}function needsPlatformApproval(c){const ids=c.contract_type==='platform_merchant'?[c.merchant_id]:c.contract_type==='platform_affiliate'?[c.affiliate_id]:[];return !!c.contract_number&&c.status==='active'&&ids.length===1&&ids.every(id=>c.acceptances.some(a=>a.user_id===id))&&!c.acceptances.some(a=>a.role==='admin')}async function approveContract(id){if(!confirm('تأكيد موافقة ممثل الإدارة على هذه النسخة كما هي؟'))return;try{await api('/api/admin/contracts/'+id+'/approve',{method:'POST',body:JSON.stringify({accepted:true})});contracts();msg('تم تسجيل اعتماد الإدارة وإتمام الاتفاقية')}catch(e){msg(e.message,true)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function orders(){let a=await api('/api/admin/orders');$('#content').innerHTML='<h2>الطلبات</h2>'+a.map(x=>'<div class="item">'+x.order_number+' — '+esc(x.customer)+' — '+x.total+' جنيه — '+x.status+'</div>').join('')||'<p>لا توجد طلبات.</p>'}
async function payouts(){let a=await api('/api/admin/payouts');$('#content').innerHTML='<h2>طلبات السحب</h2>'+a.map(x=>'<div class="item">'+esc(x.affiliate)+' — '+x.amount+' جنيه — '+esc(x.method)+' — '+esc(x.destination)+'<p><button onclick="pay('+x.id+',\'paid\')">تم التحويل</button> <button class="danger" onclick="pay('+x.id+',\'reject\')">رفض</button></p></div>').join('')||'<p>لا توجد طلبات.</p>'}async function pay(id,d){await api('/api/admin/payouts/'+id+'/'+d,{method:'POST'});payouts()}

async function contractRequests(){try{let a=await api('/api/admin/contract-requests');$('#content').innerHTML='<h2>طلبات التعاقد مع وصلة</h2>'+(a.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p class="small">'+esc(x.user_name)+' — '+esc(x.user_email)+' — '+typeName(x.requested_type)+'</p><p>'+esc(x.details)+'</p><p class="small">العمولة المطلوبة: '+(x.desired_commission??'حسب الاتفاق')+'% | الحالة: '+esc(x.status)+'</p><p>'+esc(x.admin_note)+'</p>'+(x.status==='pending'?'<div class="actions"><button onclick="decideContractRequest('+x.id+',\'approve\')">موافقة وإنشاء مسودة</button><button class="danger" onclick="decideContractRequest('+x.id+',\'reject\')">رفض</button></div>':'')+'</div>').join('')||'<p class="muted">لا توجد طلبات تعاقد.</p>')}catch(e){msg(e.message,true)}}
async function decideContractRequest(id,decision){let note=prompt('ملاحظة الإدارة للطرف مقدم الطلب (اختياري):')||'';try{await api('/api/admin/contract-requests/'+id+'/decision',{method:'POST',body:JSON.stringify({decision,admin_note:note})});contractRequests();msg('تمت مراجعة طلب التعاقد')}catch(e){msg(e.message,true)}}
async function negotiationsAdmin(){try{let a=await api('/api/admin/negotiations');$('#content').innerHTML='<h2>طلبات التفاوض</h2>'+(a.map(x=>'<div class="item"><b>'+esc(x.contract_number)+' — '+esc(x.contract_title)+'</b><p class="small">'+esc(x.proposer)+' → '+esc(x.recipient)+' | '+esc(x.status)+'</p><p>'+esc(x.proposal_text)+'</p><p class="small">السبب: '+esc(x.reason)+'</p><p>'+esc(x.response_text)+'</p>'+(x.status==='pending'?'<div class="actions"><button onclick="respondAdminNegotiation('+x.id+',\'accept\')">قبول وإنشاء إصدار جديد</button><button class="danger" onclick="respondAdminNegotiation('+x.id+',\'reject\')">رفض</button><button class="secondary" onclick="respondAdminNegotiation('+x.id+',\'counter\')">اقتراح بديل</button></div>':'')+'</div>').join('')||'<p class="muted">لا توجد مقترحات تفاوض.</p>')}catch(e){msg(e.message,true)}}
async function respondAdminNegotiation(id,decision){let response_text='';if(decision!=='accept'){response_text=prompt(decision==='counter'?'اكتب الصياغة البديلة:':'اكتب سبب الرفض:')||'';if(!response_text)return}try{await api('/api/contract-negotiations/'+id+'/respond',{method:'POST',body:JSON.stringify({decision,response_text})});negotiationsAdmin();msg('تم تسجيل الرد على المقترح')}catch(e){msg(e.message,true)}}
async function adminProducts(){try{let a=await api('/api/admin/products?limit=200');$('#content').innerHTML='<h2>إدارة المنتجات وسجل الحذف</h2>'+(a.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p class="small">رقم المنتج: '+x.id+' | '+x.price+' جنيه | الحالة: '+esc(x.status)+'</p><p class="small">التاجر: '+esc(x.merchant)+'</p>'+(x.status==='deleted'?'<p class="small">حُذف بواسطة: '+esc(x.deleted_by_role||'—')+' — '+esc(x.deleted_at||'')+'</p><button class="good" onclick="restoreAdminProduct('+x.id+')">استعادة</button>':'<button class="danger" onclick="deleteAdminProduct('+x.id+')">حذف مؤقت</button>')+'</div>').join('')||'<p class="muted">لا توجد منتجات.</p>')}catch(e){msg(e.message,true)}}
async function deleteAdminProduct(id){if(!confirm('سيتم إخفاء المنتج مؤقتًا مع الاحتفاظ بسجل العملية. هل تريد المتابعة؟'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});adminProducts();msg('تم إخفاء المنتج')}catch(e){msg(e.message,true)}}
async function restoreAdminProduct(id){try{await api('/api/admin/products/'+id+'/restore',{method:'POST'});adminProducts();msg('تمت استعادة المنتج')}catch(e){msg(e.message,true)}}

async function announcements(){
 try{
  const rows=await api('/api/admin/announcements');
  $('#content').innerHTML='<h2>الإعلانات والتنبيهات</h2><p class="small">اختر الجمهور الذي سيظهر له الإعلان. اختيار «الجميع» يعرضه للعملاء والتجار والمسوقين.</p><form id="announcementForm"><label>عنوان الإعلان</label><input name="title" minlength="3" maxlength="180" required><label>نص الإعلان</label><textarea name="body" rows="3" maxlength="5000" required></textarea><label>الفئة المستهدفة</label><select name="audience"><option value="all">الجميع</option><option value="customer">العملاء فقط</option><option value="merchant">التجار فقط</option><option value="affiliate">المسوقون فقط</option></select><label>رابط اختياري للزر (مسار داخلي أو HTTPS)</label><input name="target_url" maxlength="500" placeholder="/products أو https://..."><label>نص الزر</label><input name="button_label" maxlength="60" placeholder="اعرف المزيد"><div class="grid"><div><label>موعد بداية العرض (اختياري)</label><input name="starts_at" type="datetime-local"></div><div><label>موعد انتهاء العرض (اختياري)</label><input name="ends_at" type="datetime-local"></div></div><button>نشر الإعلان</button></form><h3>سجل الإعلانات</h3>'+ (rows.map(a=>'<div class="item"><b>'+esc(a.title)+'</b><p>'+esc(a.body)+'</p><p class="small">الجمهور: '+({'all':'الجميع','customer':'العملاء','merchant':'التجار','affiliate':'المسوقون'}[a.audience]||a.audience)+' — '+(a.is_active?'نشط':'متوقف')+'</p><div class="actions">'+(a.is_active?'<button class="danger" onclick="stopAnnouncement('+a.id+')">إيقاف الإعلان</button>':'<button class="good" onclick="resumeAnnouncement('+a.id+')">إعادة تفعيل</button>')+'</div></div>').join('')||'<p class="muted">لا توجد إعلانات حتى الآن.</p>');
  $('#announcementForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));for(const k of ['starts_at','ends_at'])f[k]=f[k]?new Date(f[k]).toISOString():null;try{await api('/api/admin/announcements',{method:'POST',body:JSON.stringify(f)});announcements();msg('تم نشر الإعلان للفئة المحددة')}catch(x){msg(x.message,true)}};
 }catch(e){msg(e.message,true)}
}
async function stopAnnouncement(id){try{await api('/api/admin/announcements/'+id,{method:'DELETE'});announcements();msg('تم إيقاف الإعلان')}catch(e){msg(e.message,true)}}
async function resumeAnnouncement(id){try{await api('/api/admin/announcements/'+id,{method:'PATCH',body:JSON.stringify({is_active:true})});announcements();msg('تمت إعادة تفعيل الإعلان')}catch(e){msg(e.message,true)}}
async function check(){try{let d=await api('/api/me');if(d.user.role==='admin')await start(d.user);else msg('هذه الصفحة مخصصة لمدير المنصة فقط. أدخل كلمة مرور الإدارة للمتابعة.',true)}catch(e){}}check();
async function terminationRequests(){try{let a=await api('/api/admin/termination-requests');$('#content').innerHTML='<h2>طلبات فسخ الاتفاقيات</h2>'+(a.map(x=>'<div class="item"><b>'+esc(x.contract_number)+' — '+esc(x.requester)+'</b><p>'+esc(x.reason)+'</p><p class="small">الحالة: '+x.status+'</p>'+(x.status==='under_review'?'<button onclick="decideTermination('+x.id+',\'accept\')">قبول الفسخ</button> <button class="danger" onclick="decideTermination('+x.id+',\'reject\')">رفض الطلب</button>':'')+'</div>').join('')||'<p class="muted">لا توجد طلبات فسخ.</p>')}catch(e){msg(e.message,true)}}
async function decideTermination(id,decision){let reason=prompt('اكتب سبب القرار:');if(!reason)return;try{await api('/api/admin/termination-requests/'+id+'/decision',{method:'POST',body:JSON.stringify({decision,reason})});terminationRequests();msg('تم تسجيل القرار')}catch(e){msg(e.message,true)}}
</script></body></html>
