<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة وِصلة</title>
<style>
:root{--bg:#07111f;--panel:#102238;--line:#27415c;--text:#eef6ff;--muted:#9bb0c7;--cyan:#4dd9df;--blue:#5689ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#17385a,transparent 35%),var(--bg);color:var(--text);font:16px Tahoma,Arial;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:20px}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{color:var(--cyan);font-size:25px;font-weight:bold}.panel,.card{background:linear-gradient(145deg,#122943,#0d1a2b);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button,button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(120deg,var(--blue),#13aebd);color:white;font-weight:bold;cursor:pointer}.tabs button{background:#1c3450}.tabs button.active{background:linear-gradient(120deg,var(--blue),#13aebd)}input,textarea,select{width:100%;background:#071525;color:white;border:1px solid #2c4866;border-radius:10px;padding:12px;margin:5px 0 12px;font:inherit}label{color:#c7d9ec;font-size:14px}.muted,.small{color:var(--muted)}.small{font-size:13px}.stat{font-size:28px;color:var(--cyan);font-weight:bold}.item{padding:13px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}.danger{background:#85344b}.good{background:#14766d}.notice{padding:12px;border-radius:10px;background:#123746;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.wrap{padding:12px}}
</style></head><body><div class="wrap">
<header class="top"><div><div class="brand">وِصلة | مركز الإدارة</div><div class="small">لوحة مستقلة لإدارة المنصة والعقود</div></div><div class="actions"><a id="publicSiteLink" href="#" style="color:var(--cyan)">العودة للموقع</a><button id="changePass" class="hidden" type="button">تغيير كلمة المرور</button><button id="logout" class="hidden">خروج</button></div></header>
<div id="message" class="notice hidden"></div>
<section id="login" class="panel"><h2>دخول الإدارة</h2><p class="muted">اكتب كلمة مرور المدير فقط.</p><form id="loginForm"><label>كلمة مرور الإدارة</label><input name="password" type="password" minlength="10" autocomplete="current-password" required><button>دخول آمن</button></form></section>
<section id="passwordPanel" class="panel hidden"><h3>تغيير كلمة مرور الإدارة</h3><form id="passwordForm"><label>كلمة المرور الحالية</label><input name="current_password" type="password" autocomplete="current-password" required><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input name="new_password" type="password" minlength="10" autocomplete="new-password" required><button>حفظ كلمة المرور الجديدة</button><button type="button" class="danger" id="cancelPass">إلغاء</button></form></section><section id="app" class="hidden"><div id="welcome" class="notice"></div><div class="tabs" id="tabs"></div><div class="panel" id="content">اختر قسمًا من الأعلى.</div></section>
</div><script>
const $=s=>document.querySelector(s);const API_BASE_RAW=window.WESLA_API_BASE||'';const API_BASE=API_BASE_RAW.endsWith('/')?API_BASE_RAW.slice(0,-1):API_BASE_RAW;const PUBLIC_SITE_URL=window.WESLA_PUBLIC_URL||'';$('#publicSiteLink').href=PUBLIC_SITE_URL||'#';async function api(url,opts={}){let r=await fetch(API_BASE+url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({detail:'استجابة غير مفهومة من خادم وصلة ('+r.status+')'}));if(!r.ok)throw Error(d.detail||'تعذر تنفيذ الطلب ('+r.status+')');return d}
function msg(t,err=false){$('#message').textContent=t;$('#message').className='notice'+(err?' danger':'');$('#message').classList.remove('hidden')}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/admin/password-login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await start(d.user)}catch(x){msg(x.message,true)}};
async function start(user){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#changePass').classList.remove('hidden');$('#welcome').textContent='مرحباً '+user.name+' — صلاحية مدير المنصة';$('#tabs').innerHTML='';[['نظرة عامة',overview],['العقود والاتفاقيات',contracts],['إنشاء اتفاقية',newContract],['طلبات التعاقد',contractRequests],['التفاوض',negotiationsAdmin],['طلبات الفسخ',terminationRequests],['المنتجات',adminProducts],['المستخدمون',users],['طلبات الانضمام',applications],['الطلبات والمبيعات',orders],['طلبات السحب',payouts]].forEach(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');fn()};$('#tabs').appendChild(b)});$('#tabs button').click()}
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
$('#changePass').onclick=()=>$('#passwordPanel').classList.toggle('hidden');$('#cancelPass').onclick=()=>$('#passwordPanel').classList.add('hidden');$('#passwordForm').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));await api('/api/admin/change-password',{method:'POST',body:JSON.stringify(d)});e.target.reset();$('#passwordPanel').classList.add('hidden');msg('تم تغيير كلمة المرور بنجاح. استخدم الجديدة في المرة القادمة.')}catch(x){msg(x.message,true)}};
async function overview(){try{let d=await api('/api/admin/overview');$('#content').innerHTML='<div class="row" style="justify-content:space-between"><h2>ملخص المنصة</h2><button class="secondary" onclick="overview()">تحديث البيانات</button></div><div class="grid">'+[['المستخدمون',d.users],['المنتجات المنشورة',d.products],['الطلبات',d.orders],['المبيعات المسلّمة',d.sales+' ج'],['عمولة وصلة المحصلة',d.platform_commission+' ج'],['عمولات المسوقين المستحقة',d.affiliate_commission+' ج'],['الطلبات المسلّمة',d.delivered_orders],['طلبات الانضمام',d.applications],['طلبات السحب',d.payouts]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join('')+'</div><p class="muted">يتم احتساب عمولات وصلة والمسوقين في هذا الملخص بعد تحويل حالة الطلب إلى «تم التسليم».</p>'}catch(e){msg(e.message,true)}}
async function contracts(){try{let a=await api('/api/admin/contracts');$('#content').innerHTML='<h2>العقود والاتفاقيات</h2>'+ (a.map(c=>'<div class="item"><b>'+esc(c.contract_number||('#'+c.id))+' — '+esc(c.title)+'</b><p class="small">'+typeName(c.contract_type)+' | الحالة: '+c.status+' | الإصدار '+c.version+' | العمولة: '+(c.commission_rate??'حسب الاتفاق')+'%</p><p>'+esc(c.body).slice(0,260)+'</p><p class="small">التاجر: '+esc(c.merchant_name||'—')+' | المسوق: '+esc(c.affiliate_name||'—')+'</p><p class="small">الموافقات: '+c.acceptances.length+' | سجل الأحداث: '+c.events.length+'</p><div class="actions">'+(c.status==='draft'?'<button onclick="act('+c.id+',\'activate\')">إرسال للتوقيع</button>':'')+(needsPlatformApproval(c)?'<button class="good" onclick="approveContract('+c.id+')">اعتماد الإدارة وإتمام الاتفاقية</button>':'')+(needsLegacyPlatformReopen(c)?'<button class="danger" onclick="reopenLegacyPlatformContract('+c.id+')">إعادة فتح الاعتماد الناقص</button>':'')+(needsNumberedReissue(c)?'<button class="secondary" onclick="reissueNumberedContract('+c.id+')">إعادة إصدار برقم رسمي</button>':'')+(['signed','termination_review','terminated'].includes(c.status)?'<button onclick="window.open(\'/api/contracts/'+c.id+'/document\',\'_blank\')">فتح النسخة النهائية / طباعة PDF</button>':'')+(c.status==='termination_review'?'<span>طلب فسخ قيد المراجعة</span>':'')+(c.status!=='archived'&&c.status!=='signed'?'<button class="danger" onclick="act('+c.id+',\'archive\')">أرشفة</button>':'')+'</div></div>').join('')||'<p class="muted">لا توجد اتفاقيات بعد.</p>') }catch(e){msg(e.message,true)}}
function typeName(t){return {platform_merchant:'المنصة مع التاجر',platform_affiliate:'المنصة مع المسوق',merchant_affiliate:'التاجر مع المسوق'}[t]||t}function needsNumberedReissue(c){return !c.contract_number&&['draft','active'].includes(c.status)}async function reissueNumberedContract(id){if(!confirm('سيتم إنشاء نسخة جديدة برقم رسمي، وأرشفة النسخة القديمة مع الاحتفاظ بسجلها. على الأطراف إعادة الموافقة على النسخة الجديدة. متابعة؟'))return;try{const d=await api('/api/admin/contracts/'+id+'/reissue-numbered',{method:'POST'});contracts();msg(d.message)}catch(e){msg(e.message,true)}}function needsLegacyPlatformReopen(c){return c.status==='signed'&&c.contract_type.startsWith('platform_')&&!c.acceptances.some(a=>a.role==='admin')}async function reopenLegacyPlatformContract(id){if(!confirm('هذه الاتفاقية سُجلت سابقًا كموقعة دون موافقة مستقلة من ممثل الإدارة. ستُعاد إلى انتظار الاعتماد مع الاحتفاظ بالبصمة التاريخية. متابعة؟'))return;try{await api('/api/admin/contracts/'+id+'/reopen-for-platform-approval',{method:'POST'});contracts();msg('أعيدت الاتفاقية إلى انتظار اعتماد الإدارة')}catch(e){msg(e.message,true)}}function needsPlatformApproval(c){const ids=c.contract_type==='platform_merchant'?[c.merchant_id]:c.contract_type==='platform_affiliate'?[c.affiliate_id]:[];return !!c.contract_number&&c.status==='active'&&ids.length===1&&ids.every(id=>c.acceptances.some(a=>a.user_id===id))&&!c.acceptances.some(a=>a.role==='admin')}async function approveContract(id){if(!confirm('تأكيد موافقة ممثل الإدارة على هذه النسخة كما هي؟'))return;try{await api('/api/admin/contracts/'+id+'/approve',{method:'POST',body:JSON.stringify({accepted:true})});contracts();msg('تم تسجيل اعتماد الإدارة وإتمام الاتفاقية')}catch(e){msg(e.message,true)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function act(id,a){try{await api('/api/admin/contracts/'+id+'/'+a,{method:'POST'});contracts();msg('تم تحديث حالة الاتفاقية')}catch(e){msg(e.message,true)}}
async function users(){let a=await api('/api/admin/users');$('#content').innerHTML='<h2>المستخدمون</h2>'+a.map(u=>'<div class="item"><b>'+esc(u.name)+'</b> — '+esc(u.email)+'<p class="small">رقم الحساب: '+u.id+' | '+u.role+' | '+u.status+'</p></div>').join('')}
async function newContract(){let us=await api('/api/admin/users');let merchants=us.filter(u=>u.role==='merchant'),affs=us.filter(u=>u.role==='affiliate');$('#content').innerHTML=`<h2>إنشاء اتفاقية جديدة</h2><form id="contractForm"><label>نوع الاتفاقية</label><select name="contract_type"><option value="platform_merchant">إدارة المنصة مع التاجر</option><option value="platform_affiliate">إدارة المنصة مع المسوق</option><option value="merchant_affiliate">التاجر مع المسوق</option></select><label>عنوان الاتفاقية</label><input name="title" required minlength="3"><label>التاجر</label><select name="merchant_id"><option value="">اختر التاجر</option>${merchants.map(u=>'<option value="'+u.id+'">'+esc(u.name)+' — '+esc(u.email)+'</option>').join('')}</select><label>المسوق</label><select name="affiliate_id"><option value="">اختر المسوق</option>${affs.map(u=>'<option value="'+u.id+'">'+esc(u.name)+' — '+esc(u.email)+'</option>').join('')}</select><label>الاسم القانوني للشخص/الجهة المتعاقدة مع المنصة</label><input name="legal_entity_name" placeholder="الاسم الحقيقي للطرف المتعاقد"><label>بداية الاتفاقية</label><input name="starts_at" type="datetime-local"><label>نهاية الاتفاقية</label><input name="ends_at" type="datetime-local"><label>نسبة العمولة %</label><input name="commission_rate" type="number" min="0" max="100" step=".01"><label>نطاق العمولة</label><select name="commission_scope"><option value="contract">هذه الاتفاقية</option><option value="all_products">جميع منتجات التاجر</option><option value="product">منتج محدد (يُستكمل ربطه بالمنتج)</option></select><label>نص الاتفاقية والحقوق والالتزامات</label><textarea name="body" rows="9" required minlength="20"></textarea><label>نوع الشرط الجزائي</label><select name="penalty_type"><option value="">لا يوجد</option><option value="fixed">مبلغ ثابت</option><option value="percent">نسبة مئوية</option></select><label>قيمة الشرط الجزائي (جنيه)</label><input name="penalty_amount" type="number" min="0" step=".01"><label>نسبة الشرط الجزائي %</label><input name="penalty_percent" type="number" min="0" max="100" step=".01"><label>تفاصيل الشروط الجزائية والمخالفة وآلية الإثبات والاعتراض</label><textarea name="penalty_terms" rows="4"></textarea><label>شروط الإلغاء والفسخ</label><textarea name="termination_terms" rows="4"></textarea><button>حفظ كمسودة</button></form><p class="small">يظهر توقيع Wesla المؤسسي بعد موافقات الأطراف. هذا ليس اعتمادًا حكوميًا أو توقيعًا إلكترونيًا معتمدًا. راجع النص مع محامٍ مصري قبل الاستخدام.</p>`;$('#contractForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));for(let k of ['merchant_id','affiliate_id','commission_rate','penalty_amount','penalty_percent'])d[k]=d[k]?Number(d[k]):null;for(let k of ['starts_at','ends_at'])d[k]=d[k]?new Date(d[k]).toISOString():null;try{await api('/api/admin/contracts',{method:'POST',body:JSON.stringify(d)});msg('تم حفظ الاتفاقية كمسودة. راجعها ثم أرسلها للأطراف.');contracts()}catch(x){msg(x.message,true)}}}
async function applications(){let a=await api('/api/admin/applications');$('#content').innerHTML='<h2>طلبات الانضمام</h2>'+a.map(x=>'<div class="item">'+esc(x.name)+' — '+esc(x.email)+' — '+x.role+'<p>'+esc(x.details)+'</p><button onclick="review('+x.id+',\'approve\')">موافقة</button> <button class="danger" onclick="review('+x.id+',\'reject\')">رفض</button></div>').join('')||'<p>لا توجد طلبات معلقة.</p>'}async function review(id,d){await api('/api/admin/applications/'+id+'/'+d,{method:'POST'});applications()}
async function orders(){let a=await api('/api/admin/orders');$('#content').innerHTML='<h2>الطلبات</h2>'+a.map(x=>'<div class="item">'+x.order_number+' — '+esc(x.customer)+' — '+x.total+' جنيه — '+x.status+'</div>').join('')||'<p>لا توجد طلبات.</p>'}
async function payouts(){let a=await api('/api/admin/payouts');$('#content').innerHTML='<h2>طلبات السحب</h2>'+a.map(x=>'<div class="item">'+esc(x.affiliate)+' — '+x.amount+' جنيه — '+esc(x.method)+' — '+esc(x.destination)+'<p><button onclick="pay('+x.id+',\'paid\')">تم التحويل</button> <button class="danger" onclick="pay('+x.id+',\'reject\')">رفض</button></p></div>').join('')||'<p>لا توجد طلبات.</p>'}async function pay(id,d){await api('/api/admin/payouts/'+id+'/'+d,{method:'POST'});payouts()}

async function contractRequests(){try{let a=await api('/api/admin/contract-requests');$('#content').innerHTML='<h2>طلبات التعاقد مع وصلة</h2>'+(a.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p class="small">'+esc(x.user_name)+' — '+esc(x.user_email)+' — '+typeName(x.requested_type)+'</p><p>'+esc(x.details)+'</p><p class="small">العمولة المطلوبة: '+(x.desired_commission??'حسب الاتفاق')+'% | الحالة: '+esc(x.status)+'</p><p>'+esc(x.admin_note)+'</p>'+(x.status==='pending'?'<div class="actions"><button onclick="decideContractRequest('+x.id+',\'approve\')">موافقة وإنشاء مسودة</button><button class="danger" onclick="decideContractRequest('+x.id+',\'reject\')">رفض</button></div>':'')+'</div>').join('')||'<p class="muted">لا توجد طلبات تعاقد.</p>')}catch(e){msg(e.message,true)}}
async function decideContractRequest(id,decision){let note=prompt('ملاحظة الإدارة للطرف مقدم الطلب (اختياري):')||'';try{await api('/api/admin/contract-requests/'+id+'/decision',{method:'POST',body:JSON.stringify({decision,admin_note:note})});contractRequests();msg('تمت مراجعة طلب التعاقد')}catch(e){msg(e.message,true)}}
async function negotiationsAdmin(){try{let a=await api('/api/admin/negotiations');$('#content').innerHTML='<h2>طلبات التفاوض</h2>'+(a.map(x=>'<div class="item"><b>'+esc(x.contract_number)+' — '+esc(x.contract_title)+'</b><p class="small">'+esc(x.proposer)+' → '+esc(x.recipient)+' | '+esc(x.status)+'</p><p>'+esc(x.proposal_text)+'</p><p class="small">السبب: '+esc(x.reason)+'</p><p>'+esc(x.response_text)+'</p>'+(x.status==='pending'?'<div class="actions"><button onclick="respondAdminNegotiation('+x.id+',\'accept\')">قبول وإنشاء إصدار جديد</button><button class="danger" onclick="respondAdminNegotiation('+x.id+',\'reject\')">رفض</button><button class="secondary" onclick="respondAdminNegotiation('+x.id+',\'counter\')">اقتراح بديل</button></div>':'')+'</div>').join('')||'<p class="muted">لا توجد مقترحات تفاوض.</p>')}catch(e){msg(e.message,true)}}
async function respondAdminNegotiation(id,decision){let response_text='';if(decision!=='accept'){response_text=prompt(decision==='counter'?'اكتب الصياغة البديلة:':'اكتب سبب الرفض:')||'';if(!response_text)return}try{await api('/api/contract-negotiations/'+id+'/respond',{method:'POST',body:JSON.stringify({decision,response_text})});negotiationsAdmin();msg('تم تسجيل الرد على المقترح')}catch(e){msg(e.message,true)}}
async function adminProducts(){try{let a=await api('/api/admin/products?limit=200');$('#content').innerHTML='<h2>إدارة المنتجات وسجل الحذف</h2>'+(a.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p class="small">رقم المنتج: '+x.id+' | '+x.price+' جنيه | الحالة: '+esc(x.status)+'</p><p class="small">التاجر: '+esc(x.merchant)+'</p>'+(x.status==='deleted'?'<p class="small">حُذف بواسطة: '+esc(x.deleted_by_role||'—')+' — '+esc(x.deleted_at||'')+'</p><button class="good" onclick="restoreAdminProduct('+x.id+')">استعادة</button>':'<button class="danger" onclick="deleteAdminProduct('+x.id+')">حذف مؤقت</button>')+'</div>').join('')||'<p class="muted">لا توجد منتجات.</p>')}catch(e){msg(e.message,true)}}
async function deleteAdminProduct(id){if(!confirm('سيتم إخفاء المنتج مؤقتًا مع الاحتفاظ بسجل العملية. هل تريد المتابعة؟'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});adminProducts();msg('تم إخفاء المنتج')}catch(e){msg(e.message,true)}}
async function restoreAdminProduct(id){try{await api('/api/admin/products/'+id+'/restore',{method:'POST'});adminProducts();msg('تمت استعادة المنتج')}catch(e){msg(e.message,true)}}
async function check(){try{let d=await api('/api/me');if(d.user.role==='admin')await start(d.user);else msg('هذه الصفحة مخصصة لمدير المنصة فقط. أدخل كلمة مرور الإدارة للمتابعة.',true)}catch(e){}}check();
async function terminationRequests(){try{let a=await api('/api/admin/termination-requests');$('#content').innerHTML='<h2>طلبات فسخ الاتفاقيات</h2>'+(a.map(x=>'<div class="item"><b>'+esc(x.contract_number)+' — '+esc(x.requester)+'</b><p>'+esc(x.reason)+'</p><p class="small">الحالة: '+x.status+'</p>'+(x.status==='under_review'?'<button onclick="decideTermination('+x.id+',\'accept\')">قبول الفسخ</button> <button class="danger" onclick="decideTermination('+x.id+',\'reject\')">رفض الطلب</button>':'')+'</div>').join('')||'<p class="muted">لا توجد طلبات فسخ.</p>')}catch(e){msg(e.message,true)}}
async function decideTermination(id,decision){let reason=prompt('اكتب سبب القرار:');if(!reason)return;try{await api('/api/admin/termination-requests/'+id+'/decision',{method:'POST',body:JSON.stringify({decision,reason})});terminationRequests();msg('تم تسجيل القرار')}catch(e){msg(e.message,true)}}
</script></body></html>
